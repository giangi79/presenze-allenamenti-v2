<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenze Allenamenti V2</title><style>body{font-family:system-ui;background:#f2f6fc;color:#18304b;margin:0}header{background:#12365d;color:white;padding:24px}main{max-width:900px;margin:auto;padding:24px}.card{background:white;padding:24px;border-radius:18px;margin:16px 0;box-shadow:0 4px 20px #12365d12}button{border:0;border-radius:12px;padding:13px;background:#2069b5;color:white;font-weight:bold;cursor:pointer}select,input{padding:12px;border:1px solid #ccc;border-radius:10px}.person{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.person button{background:#e7edf5;color:#12365d}.person button.active{background:#bcebd1;color:#095e39}.muted{color:#64758b}@media(max-width:600px){.person{flex-wrap:wrap}.person button{flex:1}}</style></head><body><header><h1>Presenze Allenamenti V2</h1><p>Prototipo indipendente · Nessun collegamento al database originale</p></header><main><div class="card"><h2>Dashboard</h2><p class="muted">Prima versione di prova con atleti inventati.</p><p id="stats"></p></div><div class="card"><h2>Registra presenze</h2><p><label>Data <input id="date" type="date"></label> <label>Gruppo <select id="group"><option>Cuccioli</option><option>Piccoli</option><option>Grandi</option><option>Serale</option></select></label></p><div id="list"></div></div><p class="muted">Le scelte sono temporanee e si azzerano ricaricando la pagina. Non vengono inviati dati online.</p></main><script>const athletes=[['Alex Rossi','Cuccioli'],['Sam Bianchi','Cuccioli'],['Luca Verdi','Piccoli'],['Giulia Neri','Piccoli'],['Andrea Blu','Grandi'],['Marta Gialli','Serale']];const state=new Map();const date=document.getElementById('date'),group=document.getElementById('group'),list=document.getElementById('list');const now=new Date();date.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');function render(){list.replaceChildren();const current=athletes.filter(a=>a[1]===group.value);let present=0;current.forEach(a=>{const key=date.value+'|'+a[0];if(state.get(key)==='P')present++;const row=document.createElement('div');row.className='person';const name=document.createElement('strong');name.textContent=a[0];row.append(name);[['P','Presente'],['A','Assente']].forEach(([v,label])=>{const b=document.createElement('button');b.textContent=label;b.className=state.get(key)===v?'active':'';b.onclick=()=>{state.get(key)===v?state.delete(key):state.set(key,v);render()};row.append(b)});list.append(row)});document.getElementById('stats').textContent='Atleti del gruppo: '+current.length+' · Presenti: '+present+' · Da registrare: '+current.filter(a=>!state.has(date.value+'|'+a[0])).length}date.onchange=render;group.onchange=render;render();</script></body></html>
